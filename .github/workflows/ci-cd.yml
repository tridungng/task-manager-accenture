name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set up Docker Buildx (optional but good practice)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry (optional, for pushing)
      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      # Build backend Docker image
      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t task-manager-backend .

      # Build frontend Docker image
      - name: Build frontend Docker image
        run: |
          cd frontend
          docker build -t task-manager-frontend .

      # Optional: Push images to GHCR (uncomment if you want to push)
      # - name: Push backend image to GHCR
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     IMAGE=ghcr.io/${{ github.repository_owner }}/task-manager-backend:${{ github.sha }}
      #     docker tag task-manager-backend $IMAGE
      #     docker push $IMAGE
      #
      # - name: Push frontend image to GHCR
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     IMAGE=ghcr.io/${{ github.repository_owner }}/task-manager-frontend:${{ github.sha }}
      #     docker tag task-manager-frontend $IMAGE
      #     docker push $IMAGE

      # Optional: Show built images
      - name: List Docker images
        run: docker images

      # Optional: Test the images by running docker-compose (if you want to test the stack)
      # - name: Test stack with docker-compose
      #   run: |
      #     cd /tmp
      #     cp ${{ github.workspace }}/docker-compose.yml .
      #     docker-compose up -d
      #     # Wait for services to be ready (simple sleep for demo, in production use healthchecks)
      #     sleep 10
      #     # Check if backend is up (example: curl http://localhost:8080/api/tasks)
      #     curl -s http://localhost:8080/api/tasks || echo "Backend not ready yet"
      #     docker-compose down
